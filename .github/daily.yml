name: Daily Blox Fruits Tip

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai
      - name: Run Coach Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          SENDER_EMAIL: "thepushkarsingh@gmail.com"
          RECIPIENT_EMAIL: "superkunnusingh@gmail.com"
        run: python coach.py
